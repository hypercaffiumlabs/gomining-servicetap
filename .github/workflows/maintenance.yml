name: Daily Service Button Tap

on:
  schedule:
    # 7 attempts, hourly, starting an hour before the daily window opens
    # (00:00 UTC = 8:00pm US Eastern, confirmed via GoMining's own FAQ) as
    # a buffer, since GitHub's scheduler has been observed missing the
    # first attempt after the window opens on some nights recently:
    # 7:15, 8:15, 9:15, 10:15, 11:15pm, 12:15, 1:15am ET (EDT, UTC-4 —
    # shifts an hour earlier during EST/winter since GitHub's scheduler
    # doesn't follow DST).
    - cron: "15 23,0-5 * * *"
  workflow_dispatch: {}

# Never let two runs overlap. GoMining rotates the refresh token on every use,
# so a second run starting from the same saved cookies (a manual dispatch during
# the nightly window, or a slow run bleeding into the next slot) could find its
# token already swapped and kill the session. cancel-in-progress is false so a
# running tap is never interrupted; a waiting run just queues behind it.
concurrency:
  group: gomining-session
  cancel-in-progress: false

jobs:
  run-maintenance:
    runs-on: ubuntu-latest
    # A normal run completes in under a minute, but the script now retries
    # a struggling account up to 3 times (~30s attempt + 10s wait each)
    # before giving up, and does this per account. Worst case for 2
    # accounts is a few minutes, plus up to 5 for a slow dependency install
    # (see below); 10 covers both while still keeping the worst-case hang
    # short -- without this, a hung step
    # (e.g. a stuck dependency install) can run for up to GitHub's 6-hour
    # default before being killed.
    timeout-minutes: 10
    steps:
      # Quiet vs loud failures. Several runs fire each night, and a tap only
      # has to succeed once per UTC day. So a failed run only fails the job
      # (and sends GitHub's "Run failed" email) when it matters:
      #   - it's the last chance of the night (UTC hour 5-22: the 05:15 slot,
      #     which GitHub often starts an hour or two late) or a manual run, AND
      #   - no run has tapped successfully yet this UTC day.
      # Earlier failures are "quiet": the job ends green with a warning and
      # the next hourly run tries again. Two things stay loud regardless: a
      # dead session (retrying can't fix it, see the last step) and Sentry's
      # "no successful tap tonight" cron alert, which catches the case where
      # GitHub never starts the last-chance run at all (see main() in
      # gomining_maintenance.py).
      - name: Work out where this run sits in tonight's window
        id: window
        run: |
          hour=$(date -u +%-H)
          echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$hour" -ge 5 ] && [ "$hour" -lt 23 ]; }; then
            echo "last_chance=true" >> "$GITHUB_OUTPUT"
          else
            echo "last_chance=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether today's tap already succeeded
        # A successful tap leaves a tiny marker in the Actions cache, keyed
        # by UTC date (saved near the end of this job). Later runs still tap
        # as normal -- each run refreshes the rotating login, which keeps the
        # gap between refreshes short -- they just fail quietly.
        id: done
        uses: actions/cache/restore@v4
        with:
          path: tap-done
          key: tap-done-${{ steps.window.outputs.today }}
          lookup-only: true

      - name: Decide whether a failure should be loud
        id: mode
        run: |
          if [ "${{ steps.window.outputs.last_chance }}" = "true" ] && [ "${{ steps.done.outputs.cache-hit }}" != "true" ]; then
            echo "quiet=false" >> "$GITHUB_OUTPUT"
            echo "Failures this run are LOUD (last chance tonight, no successful tap yet today)."
          else
            echo "quiet=true" >> "$GITHUB_OUTPUT"
            echo "Failures this run are quiet (a later run will retry, or today's tap already succeeded)."
          fi

      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reuse the downloaded Chromium (Actions cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        id: install
        # This step hung for 49+ minutes once (2026-08-17) before the
        # job-level timeout above existed. A step-specific timeout makes
        # that failure mode instantly identifiable in the Actions log
        # instead of a generic job-level timeout with no clue which step.
        # 2 minutes was too tight: on 2026-10-22 a slow Ubuntu package
        # mirror made a healthy install take longer and the run failed.
        # 5 wasn't always enough either (2026-10-23: the mirror crawled at
        # ~75 KB/s, mostly downloading optional fonts), so the Ubuntu
        # packages are now only installed if Chromium can't start without
        # them; the runner image normally already has everything it needs.
        timeout-minutes: 5
        continue-on-error: ${{ steps.mode.outputs.quiet == 'true' }}
        run: |
          pip install -r requirements.txt
          playwright install chromium
          if ! python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); p.chromium.launch().close(); p.stop()"; then
            echo "Chromium can't start yet -- installing its Ubuntu packages."
            playwright install-deps chromium
          fi

      - name: Restore the saved GoMining login (Actions cache)
        # Cache mode only (COOKIE_STORE=cache, set per-repo by the setup wizard): GoMining
        # rotates the login every time it is used, so each run saves the new one for the next.
        # This restores whatever was saved last; restore-keys' prefix picks the MOST RECENTLY
        # created entry. In secret mode (this repo's own default) it just finds nothing to
        # restore and the script ignores it.
        uses: actions/cache/restore@v4
        with:
          path: cookie-cache
          key: gomining-login-restore-only
          restore-keys: |
            gomining-login-

      - name: Run maintenance script
        id: tap
        if: steps.install.outcome == 'success'
        continue-on-error: ${{ steps.mode.outputs.quiet == 'true' }}
        env:
          # Tells the script whether a failure this run is quiet (see the
          # top of this job): quiet failures go to Sentry as warnings and
          # skip the cron check-in instead of reporting an error.
          TAP_QUIET: ${{ steps.mode.outputs.quiet }}
          # Comma-separated account labels. For each label, add a matching
          # GOMINING_COOKIES_<LABEL> secret below (e.g. a third account
          # needs GOMINING_ACCOUNT_LABELS: PRIMARY,SECONDARY,THIRD plus a
          # new GOMINING_COOKIES_THIRD: ${{ secrets.GOMINING_COOKIES_THIRD }} line).
          GOMINING_ACCOUNT_LABELS: PRIMARY,SECONDARY
          GOMINING_COOKIES_PRIMARY: ${{ secrets.GOMINING_COOKIES_PRIMARY }}
          GOMINING_COOKIES_SECONDARY: ${{ secrets.GOMINING_COOKIES_SECONDARY }}
          # Cache mode: keep the rotated login in the Actions cache, encrypted with this
          # key, instead of a personal access token. Switched over 2026-09-29.
          COOKIE_STORE: cache
          COOKIE_CACHE_KEY: ${{ secrets.COOKIE_CACHE_KEY }}
          # Optional -- publish the platform-wide Mining mode discount (read
          # from the dashboard's own data) to a public calculator's
          # mining-mode.json. CALC_REPO_TOKEN is a separate fine-grained PAT:
          # Contents read/write on that one repo, nothing else. Leave both
          # unset (as in a fork) and the whole feature is skipped.
          CALC_REPO: hypercaffiumlabs/gomining-flywheel-calculator
          CALC_REPO_TOKEN: ${{ secrets.CALC_REPO_TOKEN }}
          # Optional -- error monitoring + cron check-ins. Script runs fine
          # without this secret set, just with no Sentry visibility.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: python gomining_maintenance.py

      - name: Save this run's GoMining login (Actions cache)
        # Cache mode only. `always()` so a run that logged in fine but failed later still
        # leaves the newest login behind; the script only says cookies_updated=true when it
        # really saved a new one (never in secret mode).
        if: always() && steps.tap.outputs.cookies_updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: cookie-cache
          key: gomining-login-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Mark today's tap as done (Actions cache)
        if: steps.tap.outcome == 'success' && steps.done.outputs.cache-hit != 'true'
        run: mkdir -p tap-done && date -u > tap-done/at

      - name: Save the done marker
        if: steps.tap.outcome == 'success' && steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tap-done
          key: tap-done-${{ steps.window.outputs.today }}

      - name: Note a quiet failure
        if: steps.install.outcome == 'failure' || steps.tap.outcome == 'failure'
        run: echo "::warning::This run failed, but quietly -- a later run tonight will retry, or today's tap already succeeded. No action needed unless the last run of the night fails too."

      - name: Fail loudly on a dead session
        # A dead session fails identically on every retry, so there's no
        # point waiting for the last chance -- re-capture the cookies now.
        if: steps.tap.outputs.session_expired == 'true'
        run: |
          echo "::error::A GoMining session expired -- re-capture cookies (capture-cookies skill). See the run log for which account."
          exit 1

      - name: Upload debug artifacts on failure
        if: failure() || steps.install.outcome == 'failure' || steps.tap.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: debug-artifacts/
          retention-days: 7
