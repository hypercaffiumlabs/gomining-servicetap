name: TEMP install test (delete before merge)
'on':
  push:
    branches:
    - quiet-failures-until-last-chance
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Work out where this run sits in tonight's window
      id: window
      run: "hour=$(date -u +%-H)\necho \"today=$(date -u +%F)\" >> \"$GITHUB_OUTPUT\"\nif [ \"${{ github.event_name }}\" = \"workflow_dispatch\" ] || { [ \"$hour\" -ge 5 ] && [ \"$hour\" -lt 23 ]; }; then\n\
        \  echo \"last_chance=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"last_chance=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Decide whether a failure should be loud
      id: mode
      run: "if [ \"${{ steps.window.outputs.last_chance }}\" = \"true\" ] && [ \"${{ steps.done.outputs.cache-hit }}\" != \"true\" ]; then\n  echo \"quiet=false\" >> \"$GITHUB_OUTPUT\"\n  echo \"Failures\
        \ this run are LOUD (last chance tonight, no successful tap yet today).\"\nelse\n  echo \"quiet=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"Failures this run are quiet (a later run will retry, or today's\
        \ tap already succeeded).\"\nfi\n"
    - name: Check out repo
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Reuse the downloaded Chromium (Actions cache)
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
    - name: Install dependencies
      id: install
      timeout-minutes: 5
      continue-on-error: ${{ steps.mode.outputs.quiet == 'true' }}
      run: "pip install -r requirements.txt\nplaywright install chromium\nif ! python -c \"from playwright.sync_api import sync_playwright; p = sync_playwright().start(); p.chromium.launch().close(); p.stop()\"\
        ; then\n  echo \"Chromium can't start yet -- installing its Ubuntu packages.\"\n  playwright install-deps chromium\nfi\n"
    - name: Show decisions
      run: echo "last_chance=${{ steps.window.outputs.last_chance }} quiet=${{ steps.mode.outputs.quiet }} install=${{ steps.install.outcome }}"
    - name: Launch Chromium and load a page
      run: python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); b=p.chromium.launch(headless=True); pg=b.new_page(); pg.goto('https://example.com'); print('title:', pg.title());
        b.close(); p.stop()"
